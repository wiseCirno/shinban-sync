# 群晖 DSM Container Manager → 项目 → 新增。项目目录内放 config.yml 和本文件。
services:
  shinban-sync:
    image: ghcr.io/wisecirno/shinban-sync:latest
    container_name: shinban-sync
    restart: unless-stopped
    ports:
      - "3325:3325"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.yml:/app/config.yml
      - ./logs:/app/logs
      # 仅用本地存储时启用；把左侧改成 DSM 实际共享文件夹路径。
      # Aria2 的下载目录须与 /app/aria2 指向同一批文件。
      # - /volume1/downloads/aria2:/app/aria2
      # - /volume1/media/anime:/app/target
    command: [ "run", "--modules", "web", "--host", "0.0.0.0", "--port", "3325", "-c", "/app/config.yml" ]
    # 若需自动同步及 Telegram：把 web 改成 web,schedule,bot，并先填好对应配置。
