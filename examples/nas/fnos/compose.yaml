# 飞牛 fnOS 的 Docker/Compose 项目示例。把 config.yml 和本文件放在同一个项目目录。
services:
  shinban-sync:
    image: ghcr.io/wisecirno/shinban-sync:latest
    container_name: shinban-sync
    restart: unless-stopped
    ports:
      - "3325:3325"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.yml:/app/config.yml
      - ./logs:/app/logs
      # local 存储时取消注释，并改成飞牛文件管理器显示的实际绝对路径。
      # 下载目录必须和 Aria2 看到的是同一份文件。
      # - /你的飞牛下载目录:/app/aria2
      # - /你的飞牛媒体库目录:/app/target
    command: [ "run", "--modules", "web", "--host", "0.0.0.0", "--port", "3325", "-c", "/app/config.yml" ]
    # 需要自动同步及 Telegram 时把 web 改成 web,schedule,bot。
