services:
  shinban-sync:
    image: ghcr.io/wisecirno/shinban-sync:latest
    # build: .
    container_name: shinban-sync
    # 只跑一轮 sync 时不要 restart，改用 docker run --rm。
    restart: unless-stopped
    ports:
      - "3325:3325"
    volumes:
      - ./config.yml:/app/config.yml
      - ./logs:/app/logs
      # local 存储时再把下载目录和媒体库映射进来，并与 config.yml 中的路径一致：
      # - /your/local/aria2/path:/app/aria2
      # - /your/local/target/path:/app/target
      # sftp 私钥：
      # - /path/to/your/ssh_key:/app/ssh_key:ro
    environment:
      - TZ=Asia/Shanghai
      - ACG_RIP_MIN_INTERVAL_SECONDS=2.0
      - ACG_RIP_RETRY_AFTER_SECONDS=30.0
      - ACG_RIP_MAX_ATTEMPTS=3
    # 模块：sync（一次后退出）、web、bot、schedule。sync 不要和其他模块写在一起。
    command: ["run", "--modules", "web", "--host", "0.0.0.0", "--port", "3325", "-c", "/app/config.yml"]
    # command: ["run", "--modules", "bot", "-c", "/app/config.yml"]
    # command: ["run", "--modules", "web,bot,schedule", "--host", "0.0.0.0", "--port", "3325", "-c", "/app/config.yml"]
    # command: ["sync", "-c", "/app/config.yml"]
